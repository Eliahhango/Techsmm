<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | TechSMM</title>
  <link rel="stylesheet" href="/storage.perfectcdn.com/hmz1fi/xn3xyxzgfy8kn8r3.css">
  <link rel="stylesheet" href="/storage.perfectcdn.com/hmz1fi/knt5b5ikdcj87g78.css">
  <style>
    .admin-page { padding: 30px 0 60px; }
    .admin-page .table-responsive { overflow-x: auto; }
    .admin-page table { min-width: 620px; }
    .admin-page h1 { margin-bottom: 25px; }
    .admin-page h2 { font-size: 22px; margin: 0 0 15px; }
    .admin-page .card { margin-bottom: 24px; }
  </style>
</head>
<body class="dashboard">
  <main id="main_container">
    <div class="content_area" style="padding-left:0;">
      <div class="content">
        <div class="container-fluid admin-page">
          <h1>Admin Dashboard</h1>
          <section class="card card_v2">
            <div class="card-body">
              <h2>Users</h2>
              <div class="table-responsive"><table id="admin-users" class="table"><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Balance</th><th>Role</th></tr></thead><tbody><tr><td colspan="5">Loading...</td></tr></tbody></table></div>
            </div>
          </section>
          <section class="card card_v2">
            <div class="card-body">
              <h2>Orders</h2>
              <div class="table-responsive"><table id="admin-orders" class="table"><thead><tr><th>ID</th><th>User</th><th>Service</th><th>Status</th><th>Charge</th></tr></thead><tbody><tr><td colspan="5">Loading...</td></tr></tbody></table></div>
            </div>
          </section>
          <section class="card card_v2">
            <div class="card-body">
              <h2>Deposits</h2>
              <div class="table-responsive"><table id="admin-deposits" class="table"><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td colspan="5">Loading...</td></tr></tbody></table></div>
            </div>
          </section>
          <section class="card card_v2">
            <div class="card-body">
              <h2>Audit Logs</h2>
              <div class="table-responsive"><table id="admin-logs" class="table"><thead><tr><th>Date</th><th>Actor</th><th>Action</th><th>Entity</th></tr></thead><tbody><tr><td colspan="4">Loading...</td></tr></tbody></table></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
